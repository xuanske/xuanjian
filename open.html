<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>玄鉴 · 命理参考</title>
<meta name="description" content="玄鉴：今日黄历、问事、生辰四柱、铜钱卦。娱乐参考，不是宿命。">
<style>
  :root { --bg:#0b0c0d; --ink:#c8ccd4; --mute:#7c8088; --line:#2a2c30; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 "Songti SC","Noto Serif SC","Source Han Serif SC",serif; }
  main { max-width:640px; margin:0 auto; padding:48px 24px 80px; }
  .hero { width:100%; aspect-ratio:1200/630; object-fit:cover; border:1px solid var(--line); margin:0 0 28px; background:#111; }
  h1 { font-weight:500; font-size:42px; letter-spacing:.5em; margin:0 0 8px; }
  .sub { color:var(--mute); letter-spacing:.16em; margin-bottom:32px; }
  p { margin:0 0 14px; }
  ul { padding-left:1.2em; }
  li { margin:6px 0; }
  .box { border:1px solid var(--line); padding:18px 20px; margin:28px 0; }
  .warn { font-size:14px; color:var(--mute); }
  footer { margin-top:48px; font-size:13px; color:var(--mute); letter-spacing:.08em; }
</style>
</head>
<body>
<main>
  <img class="hero" alt="玄鉴封面：暗银圆镜与铜钱" src="public/og.jpg">
  <h1>玄鉴</h1>
  <p class="sub">命理参考 · 不是宿命</p>
  <p>先在本地排盘、摇卦，再请辞章。今日黄历、问事、生辰四柱、铜钱卦。不保证发财婚姻，也不编精确应期。</p>
  <div class="box">
    <p>能看什么</p>
    <ul>
      <li>今日：日柱与建除</li>
      <li>问事：只断一件事</li>
      <li>生辰：公历排四柱</li>
      <li>铜钱：六爻在本地摇成</li>
    </ul>
  </div>
  <p class="warn">娱乐参考，不是宿命。旧笺存在这台设备，没有账号。</p>
  <footer>拂尘 · 筹算 · 开窍 · 玄鉴</footer>
</main>
</body>
</html>
